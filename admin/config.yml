backend:
  name: github
  repo: FlorioPartenzi/decap-cms-test
  branch: main

local_backend: true

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"

    fields:
      - {label: "Layout", name: "layout", widget: "hidden", default: "layouts/base.njk"}

      - { label: "Title", name: "title", widget: "string" }

      - label: "Sections"
        name: "sections"
        widget: "list"
        types:

          - label: "Paragraph"
            name: "paragraph"
            widget: "object"
            fields:
              - {
                  label: "Style",
                  name: "style",
                  widget: "select",
                  options: ["orange", "violet", 'white']
                }
              - {
                  label: "Content",
                  name: "content",
                  widget: "markdown"
                }

          - label: "Button"
            name: "button"
            widget: "object"
            fields:
              - {
                    label: "Style",
                    name: "style",
                    widget: "select",
                    options: ["orange", "violet"],
                    default: "orange"
                  }
              - {
                  label: "Text",
                  name: "text",
                  widget: "string"
                }
              - {
                  label: "Link",
                  name: "url",
                  widget: "string"
                }

          - label: "Image"
            name: "image"
            widget: "object"
            fields:
              - {
                    label: "Style",
                    name: "style",
                    widget: "select",
                    options: ["orange", "violet"],
                    default: "orange"
                }
              - {
                  label: "Image",
                  name: "src",
                  widget: "image"
                }
              - {
                  label: "Alt Text",
                  name: "alt",
                  widget: "string"
                }

          - label: "Image + Text"
            name: "image-text"
            widget: "object"
            fields:
              - {
                    label: "Style",
                    name: "style",
                    widget: "select",
                    options: ["orange", "violet"],
                    default: "orange"
                }
              - {
                    label: "Side",
                    name: "side",
                    widget: "select",
                    options: ["left", "right"],
                    default: "left"
                }
              - {
                  label: "Image",
                  name: "src",
                  widget: "image"
                }
              - {
                  label: "Alt Text",
                  name: "alt",
                  widget: "string"
                }
              - {
                  label: "Content",
                  name: "content",
                  widget: "markdown"
                }
